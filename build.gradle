buildscript {
    repositories {
        mavenCentral()
    }
    dependencies {
        classpath 'org.parchmentmc:librarian:1.+'
    }
}

plugins {
    id 'eclipse'
    id 'idea'
    id 'net.minecraftforge.gradle' version '[6.0.36,6.2)'
}

apply plugin: 'org.parchmentmc.librarian.forgegradle'

group = mod_group_id
version = mod_version

base {
    archivesName = mod_id
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(17)
}

minecraft {
    mappings channel: mapping_channel, version: mapping_version
    copyIdeResources = true

    runs {
        configureEach {
            workingDirectory project.file('run')
            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'debug'
            // Dependency jars ship SRG refmaps; remap them so their mixins apply in a parchment-named dev run.
            property 'mixin.env.remapRefMap', 'true'
            property 'mixin.env.refMapRemappingFile', "${projectDir}/build/createSrgToMcp/output.srg"

            mods {
                "${mod_id}" {
                    source sourceSets.main
                }
            }
        }

        client {
            jvmArgs '-Xms2G', '-Xmx8G', '-Dfml.earlyprogresswindow=false'
        }

        server {
            args '--nogui'
        }
    }
}

// Same pins Wold's Vaults uses (C:/wv/build.gradle); without them the dev run fails to resolve or boot.
configurations.all {
    resolutionStrategy.eachDependency { details ->
        if (details.requested.group == 'net.jodah' && details.requested.name == 'typetools') {
            details.useVersion '0.6.3'
        }
    }
}

repositories {
    // Local, non-redistributable jars copied from the Wold's Vaults pack. See README.md.
    flatDir {
        dir 'libs'
    }
    maven {
        url 'https://cursemaven.com'
        content {
            includeGroup 'curse.maven'
        }
    }
    maven { url = 'https://maven.blamejared.com/' } // JEI
    maven { url 'https://maven.fallenbreath.me/releases' } // conditional-mixin
    maven { url = 'https://jitpack.io' } // mixinsquared
    mavenCentral()
}

dependencies {
    minecraft "net.minecraftforge:forge:${minecraft_version}-${forge_version}"
    implementation('cpw.mods:securejarhandler') { version { strictly '0.9.45' } }

    // --- What this mod compiles against ---
    implementation fg.deobf('curse.maven:ars-nouveau-401955:4543053') // 2.9.0
    implementation fg.deobf('curse.maven:vault-hunters-official-mod-458203:8508967') // 1.18.2-3.21.6.6884

    // --- Needed at runtime only: Wold's Vaults (a hard dependency in mods.toml) and Ars Nouveau's hard deps ---
    runtimeOnly fg.deobf('local:wolds-vaults-official-mod:0.34.1')
    runtimeOnly fg.deobf('local:vhapi:5.8.1')
    runtimeOnly fg.deobf('curse.maven:curios-309927:4985315')
    runtimeOnly fg.deobf('curse.maven:patchouli-306770:3846086')

    // Unit tests for the plain-Java helpers (no game is started); test scope only.
    testImplementation 'org.junit.jupiter:junit-jupiter:5.9.3'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher:1.9.3'

    // Dev-only testing aid: Freecam 1.3.5 from the pack's mods/, if present in libs/ (git-ignored).
    // Optional: a missing fg.deobf jar would break resolving every deobfuscated dependency.
    if (file('libs/freecam-forge-1.3.5.jar').exists()) {
        runtimeOnly fg.deobf('local:freecam-forge:1.3.5')
    }

    // --- Everything below is the Wold's Vaults dev runtime set, mirrored from C:/wv/build.gradle ---
    // Wold's Vaults jar-in-jar libraries, extracted from the WV jar into libs/ (dev does not load nested jars).
    runtimeOnly fg.deobf('local:forgified-sgui:1.0.2')
    runtimeOnly fg.deobf('local:vhroller:1.4.0')
    runtimeOnly fg.deobf('local:black_market_tweaks:1.8')
    runtimeOnly fg.deobf('local:vault_hunters_extra_commands:1.8.0')
    runtimeOnly fg.deobf('local:vault_hunters_extra_rules:2.1.1')
    runtimeOnly 'io.github.llamalad7:mixinextras-forge:0.4.1'
    runtimeOnly 'com.github.bawnorton.mixinsquared:mixinsquared-forge:0.2.0'
    runtimeOnly 'me.fallenbreath:conditional-mixin-forge:0.6.2'

    // VH deps
    runtimeOnly fg.deobf('curse.maven:sophisticated-backpacks-422301:5654080')
    runtimeOnly fg.deobf('curse.maven:sophisticated-core-618298:5296312')
